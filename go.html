<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taking you to our partner&hellip;</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css">
<style>
  .redirect { min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; }
  .redirect p { color: var(--text-secondary); font-size: 15px; margin: 0 0 8px; }
  .redirect a { color: var(--accent); font-size: 14px; }
  .redirect h1 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0 0 12px; }
</style>

<!-- Mgid Sensor. Only fires on our own domain, which is the entire reason
     this page exists. Without it MGID cannot optimise toward offer clicks. -->
<script type="text/javascript">
(function() {
    var d = document, w = window;
    w.MgSensorData = w.MgSensorData || [];
    w.MgSensorData.push({ cid: 988264, project: "a.mgid.com" });
    var l = "a.mgid.com";
    var n = d.getElementsByTagName("script")[0];
    var s = d.createElement("script");
    s.type = "text/javascript";
    s.async = true;
    var dt = !Date.now ? new Date().valueOf() : Date.now();
    s.src = "https://" + l + "/mgsensor.js?d=" + dt;
    n.parentNode.insertBefore(s, n);
})();
</script>

<script src="analytics.js"></script>
</head>
<body>

<div class="redirect">
  <div>
    <h1>Taking you to our partner</h1>
    <p>One moment.</p>
    <p><a id="manual" href="/">Continue now</a></p>
  </div>
</div>

<script>
(function () {
  /* Whitelist only. The destination is NEVER read from the query string,
     only an offer key. This stops the page becoming an open redirect that a
     third party could use to launder traffic through our domain.

     Each vendor declares its own parameter names because networks differ. */
  var OFFERS = {
    collective: {
      url: 'https://track.revoffers.com/aff_c?offer_id=1667&aff_id=13718',
      // Katalys/RevOffers uses source + sub1..3, NOT PerformCB's subid1..3.
      keys: { source: 'source', click: 'sub1', session: 'sub2', vendor: 'sub3' },
      src: 'mgid'
    },
    snagrx: {
      url: 'https://track.revoffers.com/aff_c?offer_id=1645&aff_id=13718',
      // SnagRX (Embody, program 1645). Katalys observed EPC $4.98, CR 3.32%.
      // Flat $150 CPA, single default landing page, native traffic permitted.
      keys: { source: 'source', click: 'sub1', session: 'sub2', vendor: 'sub3' },
      src: 'mgid'
    },
    medgm: {
      url: 'https://track.revoffers.com/aff_c?offer_id=1656&aff_id=13718&url_id=12625',
      // url_id=12625 is MEDGm's "Compounded Semaglutide Tablets" product page.
      // Sending the oral advertorial to the injection or generic page kills ad scent.
      keys: { source: 'source', click: 'sub1', session: 'sub2', vendor: 'sub3' },
      src: 'mgid'
    },
    trimrx: {
      url: 'https://noklnk.com/x/6042878',   // (1000603) TrimRx Premium DTQ - $320
      keys: { click: 'subid1', session: 'subid2', vendor: 'subid3' }
    },
    gala: {
      url: 'https://noklnk.com/x/6042879',   // (1000629) Gala GLP-1 - $425
      keys: { click: 'subid1', session: 'subid2', vendor: 'subid3' }
    }
  };

  /* offer=auto now sends everything to Collective Peptides: observed EPC $9.47
     vs roughly $0.85 for the PerformCB pair. The old vendors stay reachable by
     explicit key so nothing breaks, but they get no automatic traffic. */
  var SPLIT = ['collective'];

  function pickVendor() {
    /* v2 key: visitors who were stuck to trimrx/gala under the old split must
       not keep being sent there now that auto means Collective. */
    var k = 't7_vendor_v2';
    try {
      var saved = localStorage.getItem(k);
      if (saved && OFFERS[saved]) return saved;
      var chosen = SPLIT[Math.floor(Math.random() * SPLIT.length)];
      localStorage.setItem(k, chosen);
      return chosen;
    } catch (e) {
      return SPLIT[Math.floor(Math.random() * SPLIT.length)];
    }
  }

  var q      = new URLSearchParams(window.location.search);
  var offer  = (q.get('offer') || '').toLowerCase();
  var split  = (offer === 'auto' || offer === '');
  if (split) { offer = pickVendor(); }
  var subid1 = q.get('subid1') || 'direct';   // MGID click id
  var subid2 = q.get('subid2') || '';         // our session id
  var src    = q.get('src') || 'unknown';     // which CTA was clicked
  var pv     = q.get('pv')  || '';            // advertorial variant
  var cfg    = OFFERS[offer];

  var dest;
  if (cfg) {
    var join = cfg.url.indexOf('?') === -1 ? '?' : '&';
    var p = new URLSearchParams();
    if (cfg.keys.source && cfg.src) p.set(cfg.keys.source, cfg.src);
    p.set(cfg.keys.click, subid1);
    p.set(cfg.keys.session, subid2);
    p.set(cfg.keys.vendor, offer);
    dest = cfg.url + join + p.toString();
  } else {
    dest = '/';
  }
  document.getElementById('manual').href = dest;

  if (window.T7Analytics) {
    window.T7Analytics.track('offer_redirect', {
      offer_name: offer || 'unknown',
      source: src,
      page_variant: pv,
      valid_offer: !!cfg,
      assignment: split ? 'split' : 'forced',
      click_id: subid2
    });
  }

  /* 450ms lets the Sensor request leave the browser. replace() keeps this
     page out of history so Back does not bounce the visitor through again. */
  setTimeout(function () { window.location.replace(dest); }, 450);
})();
</script>

<noscript>
  <meta http-equiv="refresh" content="0;url=/">
</noscript>

</body>
</html>
